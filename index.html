        // --- FUNGSI BUNYI BEEP MEWAH (Web Audio API) ---
        function playLuxuryBeep() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            
            const audioCtx = new AudioContext();
            const now = audioCtx.currentTime;

            // Nada Utama (Jernih & Elegan)
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(880, now);
            osc1.frequency.exponentialRampToValueAtTime(1760, now + 0.12);
            
            gain1.gain.setValueAtTime(0.15, now);
            gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);

            // Harmoni Tambahan (Kesan Premium / Shimmer)
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(1320, now + 0.02);
            
            gain2.gain.setValueAtTime(0.08, now + 0.02);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);

            // Eksekusi Pemutaran Suara
            osc1.start(now);
            osc1.stop(now + 0.12);
            osc2.start(now + 0.02);
            osc2.stop(now + 0.15);
        }

                { time: '17:00 - 17:30', title: 'Mandi Sore', icon: 'bath', cat: 'Kebersihan' },
                { time: '18:00 - 18:30', title: 'Sholat Magrib', icon: 'heart-handshake', cat: 'Sholat' },
                { time: '18:30 - 19:30', title: 'Makan Malam & Scroll Sosmed', icon: 'utensils', cat: 'Makan' },
                { time: '19:30 - 20:00', title: 'Sholat Isya', icon: 'heart-handshake', cat: 'Sholat' },
                { time: '20:00 - 20:45', title: 'Olahraga Malam Ringan', icon: 'dumbbell', cat: 'Olahraga' },
                { time: '20:45 - 21:30', title: 'Belajar', icon: 'book-open', cat: 'Belajar' },
                { time: '21:30 - 22:00', title: 'Persiapan Tidur', icon: 'moon', cat: 'Tidur' },
                { time: '22:00', title: 'Tidur Malam', icon: 'moon', cat: 'Tidur' }
            ]
        };

        const daysOrder = ['minggu', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'];
        let currentActiveDay = 'senin';
        let todayKey = daysOrder[new Date().getDay()];
        let completedStore = JSON.parse(localStorage.getItem('user_completed_tasks_v2') || '{}');

        // Mengatur Tanggal Beserta Tahun
        function setupWeekDates() {
            const now = new Date();
            const currentDayIdx = now.getDay();
            const distanceToMonday = currentDayIdx === 0 ? -6 : 1 - currentDayIdx;
            const mondayDate = new Date(now);
            mondayDate.setDate(now.getDate() + distanceToMonday);

            const daysMap = ['senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu', 'minggu'];

            daysMap.forEach((dayKey, index) => {
                const targetDate = new Date(mondayDate);
                targetDate.setDate(mondayDate.getDate() + index);

                // Format: 12 Okt 2026
                const dateStr = targetDate.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const labelElem = document.getElementById(`date-${dayKey}`);
                if (labelElem) {
                    labelElem.innerText = dateStr;
                }
            });
        }

        function startClock() {
            const update = () => {
                const now = new Date();
                document.getElementById('live-clock').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
                document.getElementById('live-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            };
            update();
            setInterval(update, 1000);
        }

        function switchDay(day) {
            currentActiveDay = day;

            document.querySelectorAll('.day-tab').forEach(btn => {
                btn.classList.remove('bg-blue-500/10', 'text-blue-400', 'border', 'border-blue-500/20');
                btn.classList.add('text-slate-400');
            });

            const activeBtn = document.getElementById(`tab-${day}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-blue-500/10', 'text-blue-400', 'border', 'border-blue-500/20');
                activeBtn.classList.remove('text-slate-400');
            }

            const dateLabel = document.getElementById(`date-${day}`)?.innerText || '';
            const dayNameUpper = day.charAt(0).toUpperCase() + day.slice(1);
            document.getElementById('day-heading').innerText = `Jadwal Hari ${dayNameUpper} (${dateLabel})`;
            
            renderList();
        }

        function renderList() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';

            const items = masterSchedule[currentActiveDay] || [];
            let finishedCount = 0;
            const isToday = (currentActiveDay === todayKey);

            items.forEach((item, idx) => {
                const key = `${currentActiveDay}-${idx}`;
                const isCompleted = !!completedStore[key];

                if (isCompleted) finishedCount++;

                const card = document.createElement('div');
                
                // Jika bukan hari ini, jadikan kartu tidak dapat diklik (dikunci)
                let cardStyle = '';
                if (!isToday) {
                    cardStyle = 'bg-slate-950/40 border-slate-900/60 opacity-40 cursor-not-allowed';
                } else if (isCompleted) {
                    cardStyle = 'bg-slate-950/60 border-slate-800/80 cursor-not-allowed opacity-50';
                } else {
                    cardStyle = 'bg-slate-900/50 border-slate-800 hover:border-slate-700 hover:bg-slate-900 cursor-pointer';
                }

                card.className = `p-4 rounded-xl border transition-all duration-200 flex items-center justify-between gap-4 ${cardStyle}`;

                // Hanya dapat diklik jika HARI INI dan BELUM SELESAI
                if (isToday && !isCompleted) {
                    card.onclick = () => handleItemClick(key);
                }

                let badgeIcon = '';
                if (!isToday) {
                    badgeIcon = '<i data-lucide="lock" class="w-4 h-4 text-slate-600"></i>';
                } else if (isCompleted) {
                    badgeIcon = '<i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>';
                }

                card.innerHTML = `
                    <div class="flex items-center gap-3 sm:gap-4">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center ${
                            isCompleted ? 'bg-slate-800 text-slate-500' : 'bg-slate-800/80 text-blue-400 border border-slate-700/50'
                        }">
                            <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-2">
                                <h4 class="font-medium text-sm sm:text-base text-slate-100 ${isCompleted ? 'line-through text-slate-500' : ''}">${item.title}</h4>
                                <span class="text-[10px] uppercase font-semibold tracking-wider text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded border border-slate-700/40">${item.cat}</span>
                            </div>
                            <p class="text-xs text-slate-400 flex items-center gap-1 mt-1">
                                <i data-lucide="clock" class="w-3 h-3 text-slate-500"></i> ${item.time}
                            </p>
                        </div>
                    </div>
                    
                    <div class="flex items-center">
                        <div class="w-6 h-6 rounded-md border flex items-center justify-center transition-all ${
                            !isToday
                            ? 'border-slate-800 bg-slate-900/50'
                            : isCompleted 
                            ? 'bg-blue-500 border-blue-500 text-white' 
                            : 'border-slate-700 bg-slate-950'
                        }">
                            ${badgeIcon}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            document.getElementById('progress-indicator').innerText = `Kemajuan: ${finishedCount}/${items.length} Selesai`;
            lucide.createIcons();
        }

        function handleItemClick(key) {
            completedStore[key] = true;
            localStorage.setItem('user_completed_tasks_v2', JSON.stringify(completedStore));
            
            // 1. Memutar Efek Suara Beep Mewah
            playLuxuryBeep();

            // 2. Memperbarui Tampilan & Membuka Pop-up
            renderList();
            openModal();
        }

        function openModal() {
            document.getElementById('success-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('success-modal').classList.add('hidden');
        }

        startClock();
        setupWeekDates();
        switchDay(todayKey);
    </script>
</body>
</html>
